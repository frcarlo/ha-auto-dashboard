# Builds the bundle for a published GitHub release and attaches it, which is where HACS downloads it from.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build with the release version
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}" && npm run build
      - name: Attach bundle to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/auto-dashboard.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
