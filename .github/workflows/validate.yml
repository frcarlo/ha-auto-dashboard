name: Validate

# Tags are checked by the Release workflow once the bundle is attached: HACS looks for it in the release,
# and on the tag push it isn't there yet.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: plugin
