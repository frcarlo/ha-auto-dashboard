<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Auto Dashboard</title>
  <!-- The house as the editor draws it: a gable roof over the storeys, the rooms as tiles.
       Each tile shows the material it stands for on the room page: light filling up to its level,
       blind slats, a pilot light, a cold-to-warm temperature strip. -->
  <defs>
    <clipPath id="t1"><rect x="128" y="240" width="118" height="80" rx="16"/></clipPath>
    <clipPath id="t2"><rect x="266" y="240" width="118" height="80" rx="16"/></clipPath>
    <clipPath id="t4"><rect x="266" y="340" width="118" height="80" rx="16"/></clipPath>
    <linearGradient id="light" x1="0" x2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" x2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#64748b"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-20%" width="500%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0f172a"/>

  <!-- Roof -->
  <path d="M96 222 L256 98 L416 222" fill="none" stroke="#e2e8f0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Light: warm fill to 70 % with a glowing edge -->
  <g clip-path="url(#t1)">
    <rect x="128" y="240" width="118" height="80" fill="#334155"/>
    <rect x="128" y="240" width="83" height="80" fill="url(#light)"/>
    <rect x="207" y="240" width="8" height="80" fill="#fbbf24" filter="url(#glow)"/>
    <rect x="209" y="240" width="4" height="80" fill="#fde68a"/>
  </g>

  <!-- Blind: slats hanging down to half -->
  <g clip-path="url(#t2)">
    <rect x="266" y="240" width="118" height="80" fill="#334155"/>
    <rect x="266" y="246" width="118" height="9" fill="#94a3b8" opacity="0.55"/>
    <rect x="266" y="261" width="118" height="9" fill="#94a3b8" opacity="0.55"/>
    <rect x="266" y="276" width="118" height="9" fill="#94a3b8" opacity="0.55"/>
    <rect x="266" y="289" width="118" height="3" fill="#cbd5e1"/>
  </g>

  <!-- Accent tile with a pilot light -->
  <rect x="128" y="340" width="118" height="80" rx="16" fill="#6366f1"/>
  <circle cx="218" cy="366" r="12" fill="#ffffff" opacity="0.28"/>
  <circle cx="218" cy="366" r="7" fill="#ffffff"/>

  <!-- Thermostat: cold-to-warm strip with the measured value -->
  <g clip-path="url(#t4)">
    <rect x="266" y="340" width="118" height="80" fill="#334155"/>
    <rect x="266" y="406" width="118" height="14" fill="url(#scale)"/>
  </g>
  <circle cx="340" cy="406" r="11" fill="#f1f5f9" stroke="#334155" stroke-width="5"/>
</svg>
